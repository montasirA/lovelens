{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Login - LoveLens{% endblock %}
{% block content %}
<section class="auth-band py-5">
  <div class="container">
    <div class="auth-card mx-auto">
      <h1 class="h3 fw-bold">Welcome back</h1>
      <p class="text-muted">Continue your LoveLens report history.</p>
      <form method="post">{% csrf_token %}{{ form|crispy }}<button class="btn btn-rose w-100">Login</button></form>
      <div class="d-flex justify-content-between mt-3"><a href="{% url 'password_reset' %}">Reset password</a><a href="{% url 'register' %}">Create account</a></div>
    </div>
  </div>
</section>
{% endblock %}
