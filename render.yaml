services:
  - type: web
    name: lovelens
    env: python
    plan: starter
    buildCommand: ./build.sh
    startCommand: gunicorn core.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: lovelens-db
          property: connectionString
databases:
  - name: lovelens-db
    plan: starter
