{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Create Account - LoveLens{% endblock %}
{% block content %}
<section class="auth-band py-5">
  <div class="container">
    <div class="auth-card mx-auto">
      <h1 class="h3 fw-bold">Create your free account</h1>
      <p class="text-muted">Unlimited analyses and saved report history. No subscriptions.</p>
      <form method="post">{% csrf_token %}{{ form|crispy }}<button class="btn btn-rose w-100">Register</button></form>
      <p class="mt-3 mb-0 text-center">Already registered? <a href="{% url 'login' %}">Login</a></p>
    </div>
  </div>
</section>
{% endblock %}
